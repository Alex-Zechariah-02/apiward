# Checks the gateway, its static analysis, vulnerability status and the Dashboard on every
# change. The stack and browser tests run the Fetch demonstration from its
# own repository, checked out beside this one at FETCH_REF.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref, the newest wins: an older run of the same ref tells nothing the newer one will not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Fetch commit these tests are known to pass with; move it on purpose.
  FETCH_REF: 5ff5c3d27e14b6b0751e4fa4256dcfed2afadf4c

jobs:
  go:
    runs-on: ubuntu-24.04
    # Every job has a time limit, so a hung test, download or deployment frees its runner.
    timeout-minutes: 75
    env:
      EAT_PORT_OFFSET: "1000"
    defaults:
      run:
        working-directory: apiward
    steps:
      # Actions are pinned by commit and tools by version: a moved tag or a new release cannot change what a green run means.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apiward
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/fetch
          ref: ${{ env.FETCH_REF }}
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apiward/go.mod
          cache-dependency-path: |
            apiward/go.sum
            fetch/go.sum
      - run: go mod verify
      # pipefail stops the step when git or gofmt fails; every file name reaches gofmt intact.
      - shell: bash
        run: |
          git ls-files -z '*.go' | xargs -0 -r gofmt -l > "$RUNNER_TEMP/unformatted.txt"
          if [ -s "$RUNNER_TEMP/unformatted.txt" ]; then cat "$RUNNER_TEMP/unformatted.txt"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags faultinject ./...
      - run: go test ./... -count=1
      # The race detector covers every package but integration, whose tests
      # drive separately built gateway programs it does not instrument and
      # which the run above has already made.
      # The test binary's own limit ends a deadlock with a goroutine dump before the job limit cuts it off.
      # A failing go list stops the step instead of leaving the race run without packages.
      - shell: bash
        run: |
          go list ./... > "$RUNNER_TEMP/packages.txt"
          grep -v '/internal/integration$' "$RUNNER_TEMP/packages.txt" > "$RUNNER_TEMP/race.txt"
          mapfile -t packages < "$RUNNER_TEMP/race.txt"
          go test -race "${packages[@]}" -count=1 -timeout 30m

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only, never pushed: the image must build and carry its commit.
      - run: docker build --build-arg "REVISION=$GITHUB_SHA" --tag apiward:ci .
      - run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' apiward:ci)" = "$GITHUB_SHA"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Correctness checks beyond go vet, on both build variants.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags faultinject ./...
      # Security checks on the shipped code. Two rules are left out after a
      # review of every finding: G104 (unchecked errors) flags only cleanup,
      # writes to a client that has gone and audit writes that record their
      # own failure; G304 (file path from a variable) flags only paths from
      # the operator's configuration and command line. The test-support
      # packages are left out because they run commands and open files by
      # design.
      - run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet
          -exclude=G104,G304
          -exclude-dir=dashboard
          -exclude-dir=internal/gatewaytest
          -exclude-dir=internal/testfixture
          -exclude-dir=internal/issuertest
          -exclude-dir=internal/storetest
          ./...

  dashboard:
    # The browser tests run one at a time against one stack per spec file, so
    # three machines share the files, balanced by their recorded run times;
    # the checks that need run only once go with the first.
    name: dashboard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EAT_PORT_OFFSET: "2000"
      SHARD: ${{ matrix.shard }}
      # The third shard runs every spec file not listed here, so a new file
      # always runs.
      SHARD1_FILES: e2e/sessions.spec.ts e2e/changes.spec.ts e2e/connect-entry.spec.ts e2e/trial.spec.ts e2e/rules.spec.ts e2e/start.spec.ts e2e/dev.spec.ts
      SHARD2_FILES: e2e/canvas.spec.ts e2e/overview.spec.ts e2e/views.spec.ts e2e/accounts.spec.ts e2e/traffic.spec.ts e2e/upstreams.spec.ts e2e/motion.spec.ts e2e/permissions.spec.ts e2e/environment.spec.ts e2e/explanations.spec.ts
    defaults:
      run:
        working-directory: apiward/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apiward
          persist-credentials: false
      # The browser tests run the Fetch demo tool and build its shop.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/fetch
          ref: ${{ env.FETCH_REF }}
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apiward/go.mod
          cache-dependency-path: |
            apiward/go.sum
            fetch/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same release as the image build stage.
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: |
            apiward/dashboard/package-lock.json
            fetch/client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # A release binary embeds this build: prove the embedui build carries it.
      - if: matrix.shard == 1
        run: cp -r dist ../internal/adminui/dist
      - if: matrix.shard == 1
        run: go -C .. vet -tags embedui ./...
      - if: matrix.shard == 1
        run: go -C .. test -tags embedui ./internal/adminui -count=1
      # high: a high or critical advisory fails the job; lower ones go with the routine updates.
      - if: matrix.shard == 1
        run: npm audit --audit-level=high
      # The tests run in the runner image's Chrome (playwright.config.ts).
      # Failure traces hold page contents and test credentials, so they stay
      # on the machine that ran the tests and are not uploaded.
      - run: |
          files=()
          for file in e2e/*.spec.ts; do
            case " $SHARD1_FILES " in *" $file "*) listed=1 ;; *) listed= ;; esac
            case " $SHARD2_FILES " in *" $file "*) listed=2 ;; esac
            if [ "${listed:-3}" = "$SHARD" ]; then files+=("$file"); fi
          done
          npx playwright test "${files[@]}"

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Development dependencies build the shipped Dashboard.
          fail-on-scopes: runtime, development, unknown
