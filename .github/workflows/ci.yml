# Checks the gateway, its vulnerability status and the Dashboard on every
# change. The stack and browser tests run the Fetch demonstration from its
# own repository, checked out beside this one at FETCH_REF.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Fetch commit these tests are known to pass with; move it on purpose.
  FETCH_REF: c3f157a610f724632a2c814b1416a545d137d33b

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EAT_PORT_OFFSET: "1000"
    defaults:
      run:
        working-directory: apiward
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apiward
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/fetch
          ref: ${{ env.FETCH_REF }}
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apiward/go.mod
          cache-dependency-path: |
            apiward/go.sum
            fetch/go.sum
      - run: go mod verify
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go vet -tags faultinject ./...
      - run: go test ./... -count=1
      # The race detector covers every package but integration, whose tests
      # drive separately built gateway programs it does not instrument and
      # which the run above has already made.
      - run: go test -race $(go list ./... | grep -v '/internal/integration$') -count=1 -timeout 30m

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EAT_PORT_OFFSET: "2000"
    defaults:
      run:
        working-directory: apiward/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apiward
          persist-credentials: false
      # The browser tests run the Fetch demo tool and build its shop.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/fetch
          ref: ${{ env.FETCH_REF }}
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apiward/go.mod
          cache-dependency-path: |
            apiward/go.sum
            fetch/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apiward/dashboard/package-lock.json
            fetch/client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # A release binary embeds this build: prove the embedui build carries it.
      - run: cp -r dist ../internal/adminui/dist
      - run: go -C .. vet -tags embedui ./...
      - run: go -C .. test -tags embedui ./internal/adminui -count=1
      - run: npm audit --audit-level=high
      # The tests run in the runner image's Chrome (playwright.config.ts).
      # Failure traces hold page contents and test credentials, so they stay
      # on the machine that ran the tests and are not uploaded.
      - run: npx playwright test

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
