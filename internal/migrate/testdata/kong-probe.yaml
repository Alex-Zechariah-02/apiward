_format_version: "3.0"
services:
  - name: shop
    url: "{{upstream}}"
    plugins:
      - name: cors
        config:
          origins: ['https://shop\.example']
          methods: [GET, POST]
          headers: [Content-Type]
    routes:
      - name: items
        paths: ["~/items$"]
        methods: [GET]
        strip_path: false
      - name: catalog
        paths: [/catalog]
        methods: [GET]
        strip_path: false
      - name: orders
        paths: ["~/orders/.+"]
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [CUSTOMER]
          - name: request-size-limiting
            config:
              allowed_payload_size: 1
              size_unit: kilobytes
      - name: staff
        paths: ["~/staff$"]
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [STAFF]
      - name: limited
        paths: ["~/limited$"]
        methods: [GET]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: acl
            config:
              allow: [CUSTOMER]
          - name: rate-limiting
            config:
              second: 10
              limit_by: consumer
              policy: local
              fault_tolerant: false
      - name: site
        paths: ["~/site$"]
        methods: [GET, OPTIONS]
        strip_path: false
      - name: hosted
        paths: ["~/hosted$"]
        methods: [GET]
        hosts: ["*.example.com"]
        headers:
          x-version: [v2]
        strip_path: false
      - name: closed
        paths: ["~/closed$"]
        methods: [GET]
        strip_path: false
        plugins:
          - name: acl
            config:
              allow: [STAFF]
consumers:
  - username: shop-frontend
    acls:
      - group: CUSTOMER
    jwt_secrets:
      - key: "{{issuer}}"
        algorithm: RS256
        rsa_public_key: "{{public_key}}"
